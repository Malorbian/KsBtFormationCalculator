<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width,initial-scale=1" />
		<title>KsBt Formation Calculator</title>
		<link rel="stylesheet" href="style.css">
	</head>
	<body>
		<main class="app">
			<form id="calculator-form" class="form-container" aria-labelledby="form-title">
				<h2 id="form-title">Formation Calculator</h2>

				<!-- Tier inputs: each contains Infantry, Cavalry, Archer inputs -->

					<h1 id="result-title">Enter All Your Troops <button class="info-btn" data-type="images" aria-label="Info: mobile images">i</button></h1>

					<div class="tier" id="tier-t10">
						<div class="tier-header">T10</div>
						<div class="tier-row">
							<div class="subclass">
								<label for="t10-infantry">Infantry</label>
								<input type="number" id="t10-infantry" name="t10-infantry" step="1" inputmode="numeric" />
							</div>
							<div class="subclass">
								<label for="t10-cavalry">Cavalry</label>
								<input type="number" id="t10-cavalry" name="t10-cavalry" step="1" inputmode="numeric" />
							</div>
							<div class="subclass">
								<label for="t10-archer">Archer</label>
								<input type="number" id="t10-archer" name="t10-archer" step="1" inputmode="numeric" />
							</div>
						</div>
					</div>

					<div class="tier" id="tier-t9">

								<label for="t9-archer">Archer</label>
								<input type="number" id="t9-archer" name="t9-archer" step="1" inputmode="numeric" />
							</div>
						</div>
					</div>

					<div class="tier" id="tier-t8">

						<div class="tier-row">
							<div class="subclass">
								<label for="t8-infantry">Infantry</label>

							</div>
							<div class="subclass">
								<label for="t8-cavalry">Cavalry</label>
								<input type="number" id="t8-cavalry" name="t8-cavalry" step="1" inputmode="numeric" />

				<div class="tier" id="tier-t6">

						<div class="subclass">
							<label for="t6-archer">Archer</label>
							<input type="number" id="t6-archer" name="t6-archer" step="1" inputmode="numeric" />

					</div>

				<div class="tier" id="tier-t5">

				</div>
				</fieldset>

				<!-- Formations heading with optional video info -->
				<h1 id="formations-title">Formations </h1>

				<fieldset class="groups" aria-label="Options">
                    <div class="tier" id="options">
                        <div class="tier-header">Options</div>
                    
                        <div class="subclass">
                                    <label for="march-cap">March cap</label>
                                    <input type="number" id="march-cap" name="march-cap" step="1" inputmode="numeric" value="110000" />
                        </div>
                        <div class="subclass">
                                    <label for="join-cap">Join cap</label>
                                    <input type="number" id="join-cap" name="join-cap" step="1" inputmode="numeric" value="60000" />
                        </div>
                        <div class="subclass">
                                    <label for="max-marches">Max Marches</label>
                                    <input type="number" id="max-marches" name="max-marches" step="1" inputmode="numeric" value="6" />
                                    <label class="checkbox">
										<input type="checkbox" id="host-own-rally" name="host-own-rally" checked />
                                        <span>Host own rally</span>
                                    </label>
                        </div>
                    </div>

                        
                    </div>
				</fieldset>


                <h1 id="result-title">Formations <button class="info-btn" data-type="video" aria-label="Info: short video">i</button> </h1>

				<!-- Output formations: Join and Host (readonly fields mirroring inputs) -->

										<label>Cavalry</label>

							</div>
						</div>

						<div class="tier" id="join-tier-t7">
							<div class="tier-header">T7</div>
							<div class="tier-row">
								<div class="subclass">
									<label>Infantry</label>
									<input type="number" id="join-t7-infantry" readonly />
								</div>
								<div class="subclass">
									<label>Cavalry</label>
									<input type="number" id="join-t7-cavalry" readonly />

								<div class="subclass">
									<label>Archer</label>
									<input type="number" id="join-t7-archer" readonly />

							</div>
						</div>

						<div class="tier" id="join-tier-t6">
							<div class="tier-header">T6</div>
							<div class="tier-row">
								<div class="subclass">
									<label>Infantry</label>

					</div>

					<div class="formation" id="formation-host">

						<div class="groups">
							<div class="tier" id="host-tier-t10">

				<output id="results" class="results" aria-live="polite"></output>
			</form>
		</main>

			<!-- Info modal (images + video) -->
			<div id="info-modal" class="info-modal" aria-hidden="true">
				<div class="info-overlay" data-action="close"></div>
				<div class="info-content" role="dialog" aria-modal="true">
					<button class="info-close" data-action="close" aria-label="Close">×</button>
					<div class="info-body">
						<div class="info-images" style="display:none;">
							<img id="info-image" class="mobile-img" src="" alt="Mobile view" />
							<div class="img-controls">
								<button class="img-prev" aria-label="Previous image">‹</button>
								<button class="img-next" aria-label="Next image">›</button>
							</div>
						</div>
						<div class="info-video" style="display:none;">
							<video id="info-video" class="video-player" controls preload="metadata">
								<source id="info-video-src" src="" type="video/mp4">
								Your browser does not support the video tag.
							</video>
						</div>
					</div>
				</div>
			</div>

			<script src="dist/main.js" defer></script>
